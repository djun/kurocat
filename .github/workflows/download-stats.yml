name: Download Stats

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect GitHub release download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect-download-stats.py

      - name: Commit snapshot
        run: |
          if git diff --quiet -- website/data/download-stats.json; then
            echo "No changes in download stats"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/download-stats.json
          git commit -m "chore: update download stats [skip ci]"
          git push
