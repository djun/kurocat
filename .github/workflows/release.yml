name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Only build Linux (x86_64 + ARM64) packages'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS Universal (10.15+) packages'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag label for artifact naming (e.g. v4.8.0)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.macos_only)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Rename Windows installer asset
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF_NAME -match '^v') {
              $tag = $env:GITHUB_REF_NAME
            } else {
              $version = node -p "require('./package.json').version"
              $tag = "v$version"
            }
          }
          $ver = $tag.TrimStart('v')
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'Windows NSIS installer was not generated'
          }
          Copy-Item $nsis.FullName "KuroCat-$ver-x64-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          if-no-files-found: error
          path: |
            KuroCat-*-x64-setup.exe

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            KuroCat-*-x64-setup.exe

  build-macos:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_only) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::warning::APPLE_CERTIFICATE is not set, skipping certificate import"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          echo "=== Code signing identities in temporary keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"; then
              echo "::error::APPLE_SIGNING_IDENTITY '$APPLE_SIGNING_IDENTITY' was not found in the imported certificate"
              exit 1
            fi
            echo "Developer ID Application identity '$APPLE_SIGNING_IDENTITY' is ready"
          fi

      - name: Build Tauri Universal macOS .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::APPLE_SIGNING_IDENTITY is not set, the build will not be Developer ID signed"
            unset APPLE_SIGNING_IDENTITY
          fi
          npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Verify Developer ID Application signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          test -d "$APP_PATH"
          echo "=== Signature details ==="
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "Authority=Developer ID Application"
            codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "TeamIdentifier="
            echo "Verified Developer ID Application signature"
          fi

      - name: Notarize and staple macOS .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not fully set, skipping notarization"
            exit 0
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          ZIP_PATH="$RUNNER_TEMP/KuroCat-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          SUB_ID="$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')"
          echo "Notary submission id: $SUB_ID"

          STATUS=""
          for attempt in 1 2 3; do
            xcrun notarytool wait "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --timeout 12m || true
            STATUS="$(xcrun notarytool info "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))')"
            echo "Notary status (attempt $attempt): $STATUS"
            if [[ "$STATUS" == "Accepted" || "$STATUS" == "Rejected" || "$STATUS" == "Invalid" ]]; then
              break
            fi
            sleep 30
          done

          if [[ "$STATUS" == "Accepted" ]]; then
            xcrun stapler staple "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            spctl -a -vv -t exec "$APP_PATH" || true
          else
            echo "::warning::App notarization did not reach Accepted (status=$STATUS). Packaging will continue with a signed-but-unnotarized artifact."
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | tail -40 || true
          fi

      - name: Package Universal macOS .dmg and .app.tar.gz
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/KuroCat.app"
          test -d "$APP_PATH"
          echo "=== Verify macOS minimum version, code signature & Universal slices ==="
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 || true
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -i MinimumSystemVersion || true
          lipo -info "$APP_PATH/Contents/MacOS/KuroCat"
          lipo -info "$APP_PATH/Contents/MacOS/KuroCat" | grep -q 'x86_64'
          lipo -info "$APP_PATH/Contents/MacOS/KuroCat" | grep -q 'arm64'
          otool -arch x86_64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          otool -arch arm64 -l "$APP_PATH/Contents/MacOS/KuroCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "KuroCat" -srcfolder dmg_staging -ov -format UDZO "KuroCat-${TAG}-macos-universal.dmg"
          tar -czf "KuroCat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "KuroCat.app"
          test -s "KuroCat-${TAG}-macos-universal.dmg"
          test -s "KuroCat-${TAG}-macos-universal.app.tar.gz"
          ls -lh "KuroCat-${TAG}-macos-universal.dmg" "KuroCat-${TAG}-macos-universal.app.tar.gz"

      - name: Sign and notarize macOS .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$(ls KuroCat-*-macos-universal.dmg | head -n 1)"
          test -f "$DMG_PATH"
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
            codesign --verify --verbose=2 "$DMG_PATH"
          else
            echo "::warning::APPLE_SIGNING_IDENTITY is not set, skipping DMG signing"
          fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::warning::Notarization credentials not fully set, skipping DMG notarization"
            exit 0
          fi
          SUB_ID="$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')"
          echo "DMG notary submission id: $SUB_ID"

          STATUS=""
          for attempt in 1 2 3; do
            xcrun notarytool wait "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --timeout 12m || true
            STATUS="$(xcrun notarytool info "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))')"
            echo "DMG notary status (attempt $attempt): $STATUS"
            if [[ "$STATUS" == "Accepted" || "$STATUS" == "Rejected" || "$STATUS" == "Invalid" ]]; then
              break
            fi
            sleep 30
          done

          if [[ "$STATUS" == "Accepted" ]]; then
            xcrun stapler staple "$DMG_PATH"
            xcrun stapler validate "$DMG_PATH"
            spctl -a -t open --context context:primary-signature -vv "$DMG_PATH" || true
          else
            echo "::warning::DMG notarization did not reach Accepted (status=$STATUS). Uploading signed-but-unnotarized DMG."
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | tail -40 || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-macos-universal
          if-no-files-found: error
          path: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            KuroCat-*-macos-universal.dmg
            KuroCat-*-macos-universal.app.tar.gz

  build-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Linux .deb (KylinOS / Ubuntu / Debian / UOS)
        run: npm run tauri -- build --bundles deb

      - name: Build Tauri Linux .AppImage (best-effort)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm run tauri -- build --bundles appimage || echo "AppImage bundle skipped on ${{ matrix.arch }}"

      - name: Smoke-test Linux binary and inspect ELF / .deb metadata
        run: |
          BIN="src-tauri/target/release/KuroCat"
          test -x "$BIN"
          echo "=== Dynamic libraries ==="
          ldd "$BIN"
          echo "=== Max GLIBC symbols required ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 10
          echo "=== MCP stdio live smoke test ==="
          RESP=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | "$BIN" --mcp)
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"kurocat"'
          echo "=== DEB metadata ==="
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -I "$DEB"

      - name: Rename Linux packages
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          ARCH="${{ matrix.arch }}"
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          cp "$DEB" "KuroCat-${TAG}-linux-${ARCH}.deb"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [[ -n "$APPIMG" && -f "$APPIMG" ]]; then
            cp "$APPIMG" "KuroCat-${TAG}-linux-${ARCH}.AppImage"
          fi
          ls -lh KuroCat-${TAG}-linux-${ARCH}.*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-linux-${{ matrix.arch }}
          path: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage

      - name: Publish Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            KuroCat-*-linux-${{ matrix.arch }}.deb
            KuroCat-*-linux-${{ matrix.arch }}.AppImage
